<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f2a44"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <!-- Expense Tracker column -->
  <rect x="30" y="20" width="330" height="36" rx="6" fill="#0f2a44"/>
  <text x="195" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Expense Tracker</text>

  <g font-size="13" fill="#1a1a1a">
    <rect x="55" y="76" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="195" y="93" text-anchor="middle">Start — load expenses.csv</text>
    <text x="195" y="111" text-anchor="middle" font-size="11" fill="#555555">FileNotFoundError → empty list</text>

    <line x1="195" y1="120" x2="195" y2="136" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="55" y="136" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="195" y="153" text-anchor="middle">Menu — Add / Show / Totals / Exit</text>
    <text x="195" y="171" text-anchor="middle" font-size="11" fill="#555555">choice 1–4</text>

    <line x1="195" y1="180" x2="195" y2="196" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="55" y="196" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="195" y="213" text-anchor="middle">Add expense — date, item, category</text>
    <text x="195" y="231" text-anchor="middle" font-size="11" fill="#555555">invalid amount → ValueError → ask again</text>

    <line x1="195" y1="240" x2="195" y2="256" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="55" y="256" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="195" y="273" text-anchor="middle">Show all / totals by category</text>
    <text x="195" y="291" text-anchor="middle" font-size="11" fill="#555555">unique categories via set</text>

    <line x1="195" y1="300" x2="195" y2="316" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="55" y="316" width="280" height="44" rx="6" fill="#e8f0f7" stroke="#0f2a44" stroke-width="1"/>
    <text x="195" y="333" text-anchor="middle">Save to expenses.csv</text>
    <text x="195" y="351" text-anchor="middle" font-size="11" fill="#555555">records persist for next run</text>
  </g>

  <!-- Attendance Cleaner column -->
  <rect x="420" y="20" width="330" height="36" rx="6" fill="#0f2a44"/>
  <text x="585" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Attendance Cleaner</text>

  <g font-size="13" fill="#1a1a1a">
    <rect x="445" y="76" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="585" y="93" text-anchor="middle">Read attendance.txt</text>
    <text x="585" y="111" text-anchor="middle" font-size="11" fill="#555555">one name per line</text>

    <line x1="585" y1="120" x2="585" y2="136" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="445" y="136" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="585" y="153" text-anchor="middle">Clean — strip() + title()</text>
    <text x="585" y="171" text-anchor="middle" font-size="11" fill="#555555">list comprehension</text>

    <line x1="585" y1="180" x2="585" y2="196" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="445" y="196" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="585" y="213" text-anchor="middle">Remove duplicates with set</text>
    <text x="585" y="231" text-anchor="middle" font-size="11" fill="#555555">count unique students</text>

    <line x1="585" y1="240" x2="585" y2="256" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="445" y="256" width="280" height="44" rx="6" fill="#f2f2f2" stroke="#0f2a44" stroke-width="1"/>
    <text x="585" y="273" text-anchor="middle">Sort alphabetically</text>
    <text x="585" y="291" text-anchor="middle" font-size="11" fill="#555555">sorted()</text>

    <line x1="585" y1="300" x2="585" y2="316" stroke="#0f2a44" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="445" y="316" width="280" height="44" rx="6" fill="#e8f0f7" stroke="#0f2a44" stroke-width="1"/>
    <text x="585" y="333" text-anchor="middle">Save attendance_clean.csv</text>
    <text x="585" y="351" text-anchor="middle" font-size="11" fill="#555555">clean, sorted, unique list</text>
  </g>

  <text x="390" y="410" text-anchor="middle" font-size="12" fill="#555555">Personal Finance &amp; Student Attendance Management System — Assessment 4</text>
</svg>
